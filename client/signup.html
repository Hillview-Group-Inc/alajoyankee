<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your Alajo Yankee account and start building community wealth today." />
  <title>Sign Up | Alajo Yankee</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a6b3c'/><text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='18' font-family='Georgia' font-weight='800'>A</text></svg>" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="page-loader" id="pageLoader"><div class="loader-ring"></div></div>
<div id="toast-container" aria-live="polite"></div>

<!-- Minimal nav for auth pages -->
<nav class="navbar" id="navbar" style="background:white;box-shadow:0 1px 0 var(--color-border);">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><div class="nav-logo-icon">A</div>Alajo Yankee</a>
    <div class="nav-links">
      <span style="color:var(--color-text-muted);font-size:.9rem;">Already have an account?</span>
      <a href="signin.html" class="btn btn-primary btn-sm">Sign In</a>
    </div>
  </div>
</nav>

<main class="auth-page">
  <!-- Background decoration -->
  <div aria-hidden="true" style="position:fixed;top:0;right:0;width:50%;height:100vh;background:linear-gradient(135deg,var(--color-primary-subtle),transparent);pointer-events:none;z-index:0;"></div>

  <div class="auth-card" style="position:relative;z-index:1;">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">
        <div class="nav-logo-icon" style="width:52px;height:52px;font-size:1.4rem;border-radius:14px;">A</div>
      </a>
      <h2>Create Your Account</h2>
      <p>Join Alajo Yankee and start building community wealth.</p>
    </div>

    <div id="signupAlert" style="margin-bottom:20px;display:none;" role="alert"></div>

    <form id="signupForm" novalidate>
      <div class="grid-2" style="gap:16px;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" for="firstName">First Name <span class="required">*</span></label>
          <input type="text" id="firstName" name="firstName" class="form-control" placeholder="Kwame" required autocomplete="given-name" />
          <span class="form-error" id="firstName-error" style="display:none;"></span>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" for="lastName">Last Name <span class="required">*</span></label>
          <input type="text" id="lastName" name="lastName" class="form-control" placeholder="Asante" required autocomplete="family-name" />
          <span class="form-error" id="lastName-error" style="display:none;"></span>
        </div>
      </div>
      <div style="margin-bottom:22px;"></div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address <span class="required">*</span></label>
        <div class="input-group">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <span class="form-error" id="email-error" style="display:none;"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number <span class="required">*</span></label>
        <div class="input-group">
          <span class="input-icon">📞</span>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1 (555) 000-0000" required autocomplete="tel" />
        </div>
        <span class="form-error" id="phone-error" style="display:none;"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required autocomplete="new-password" />
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">👁</button>
        </div>
        <div class="password-strength" id="passwordStrength" style="display:none;">
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-text" id="strengthText"></span>
        </div>
        <span class="form-error" id="password-error" style="display:none;"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password <span class="required">*</span></label>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repeat your password" required autocomplete="new-password" />
          <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Toggle confirm password visibility">👁</button>
        </div>
        <span class="form-error" id="confirmPassword-error" style="display:none;"></span>
      </div>

      <div class="form-group">
        <label class="check-group">
          <input type="checkbox" id="agreeTerms" name="agreeTerms" required />
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </label>
        <span class="form-error" id="terms-error" style="display:none;"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:8px;" id="signupBtn">
        <span id="signupBtnText">Create Account</span>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="signin.html">Sign in here</a>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
